<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vinted Checker</title>
    <link rel="stylesheet" href="/style.css" />
    <style>
      #drop {
        background: var(--surface);
        border: 2px dashed var(--line);
        border-radius: 10px;
        min-height: 220px;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 20px;
        cursor: pointer;
      }
      #drop.over {
        border-color: var(--teal);
      }
      #drop > img {
        max-width: 100%;
        max-height: 360px;
        border-radius: 6px;
      }
      #drop .thumbs {
        justify-content: center;
      }
      #hint strong {
        display: block;
        font-size: 1.1rem;
        margin-bottom: 4px;
      }
      #hint span {
        color: var(--muted);
      }
      #result {
        margin-top: 20px;
      }
      .photos {
        margin-top: 16px;
      }
      .photos .thumb img {
        border: 3px solid transparent;
      }
      .photos .thumb.flag img {
        border-color: var(--flag);
      }
      .photos .thumb.maybe img {
        border-color: var(--maybe);
      }
      .photos .thumb.ok img {
        border-color: var(--ok);
      }
      .photos .thumb {
        background: none;
      }
      .confirm {
        margin-top: 20px;
        font-size: 0.9rem;
      }
      .confirm-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <main>
      <nav>
        <a href="/" aria-current="page">Check</a>
        <a href="/history.html">History</a>
        <a href="/references.html">References</a>
      </nav>
      <h1>Vinted Checker</h1>
      <p class="sub">Is this from a fast-fashion shop? Add one or more photos of a listing to find out.</p>

      <div id="warning"></div>
      <div id="drop" tabindex="0" role="button" aria-label="Paste, drop or choose photos">
        <div id="hint">
          <strong>Paste a photo with Ctrl+V (Cmd+V on Mac)</strong>
          <span>or drop up to 8 photos of one listing here, or click to choose them</span>
        </div>
      </div>
      <input id="file" type="file" accept="image/*" multiple hidden />

      <div id="result" aria-live="polite"></div>
    </main>

    <script type="module">
      import { SHOPS, METHOD, esc, safeUrl, api, embeddingWarning } from "/common.js";

      const MAX_PHOTOS = 8;
      const drop = document.getElementById("drop");
      const fileInput = document.getElementById("file");
      const result = document.getElementById("result");

      // Ask the server once whether online search is configured, so the loading text is accurate.
      let webSearch = false;
      api("/health")
        .then((h) => (webSearch = Boolean(h.webSearch)))
        .catch(() => {});
      embeddingWarning().then((html) => (document.getElementById("warning").innerHTML = html));

      function showImages(srcs) {
        if (srcs.length === 1) {
          const img = document.createElement("img");
          img.alt = "Photo being checked";
          img.src = srcs[0];
          drop.replaceChildren(img);
        } else {
          drop.innerHTML =
            '<div class="thumbs">' +
            srcs
              .map((s, i) => '<div class="thumb"><img alt="Photo ' + (i + 1) + '" src="' + esc(s) + '"></div>')
              .join("") +
            "</div>";
        }
      }

      async function check(files) {
        if (files.length > MAX_PHOTOS) {
          result.innerHTML =
            '<div class="verdict flag">Please add at most ' + MAX_PHOTOS + " photos of one listing at once.</div>";
          return;
        }
        showImages(files.map((f) => URL.createObjectURL(f)));
        const what = files.length > 1 ? files.length + " photos" : "photo";
        result.innerHTML =
          '<p class="note">' +
          (webSearch
            ? "Checking " + what + " and searching online…"
            : "Checking " + what + " against saved references…") +
          "</p>";

        const form = new FormData();
        for (const f of files) form.append("file", f, f.name || "pasted.png");
        try {
          render(await api("/check", { method: "POST", body: form }));
          history.replaceState(null, "", location.pathname);
        } catch (err) {
          result.innerHTML = '<div class="verdict flag">' + esc(err.message || "Check failed.") + "</div>";
        }
      }

      function verdictHtml(data) {
        const n = data.matches?.length ?? 0;
        const photos = data.images?.length > 1 ? " across " + data.images.length + " photos" : "";
        const count = n + " match" + (n === 1 ? "" : "es") + " found" + photos;
        if (data.verdict === "likely_fast_fashion") {
          return '<div class="verdict flag">Likely from a fast-fashion shop<small>' + count + "</small></div>";
        }
        if (data.verdict === "possible_fast_fashion") {
          return (
            '<div class="verdict maybe">Possibly from a fast-fashion shop<small>' +
            count +
            ", weak evidence only. Open the links before deciding.</small></div>"
          );
        }
        return '<div class="verdict ok">No fast-fashion match found<small>This does not prove the photo is original.</small></div>';
      }

      // One thumbnail per photo, outlined by that photo's own verdict.
      function photosHtml(data) {
        if (!(data.images?.length > 1) || !data.imageUrls) return "";
        const cls = { likely_fast_fashion: "flag", possible_fast_fashion: "maybe", no_match_found: "ok" };
        return (
          '<div class="photos thumbs">' +
          data.images
            .map((img) => {
              const score = img.closest ? img.closest.score.toFixed(2) + " " + esc(img.closest.sourceName) : "";
              return (
                '<div class="thumb ' +
                (cls[img.verdict] || "") +
                '"><img alt="Photo ' +
                (img.index + 1) +
                '" src="' +
                esc(data.imageUrls[img.index]) +
                '"><div class="caption">Photo ' +
                (img.index + 1) +
                (score ? " · " + score : "") +
                "</div></div>"
              );
            })
            .join("") +
          "</div>"
        );
      }

      function matchesHtml(data) {
        if (!data.matches?.length) return "";
        const several = data.images?.length > 1;
        return (
          '<h2>Shop matches</h2><ul class="matches">' +
          data.matches
            .map((m) => {
              const url = safeUrl(m.sourceUrl);
              // Only local checks have a real score; web results only say what kind of match it was.
              const score = typeof m.similarity === "number" ? " · " + Math.round(m.similarity * 100) + "%" : "";
              const photo = several && m.image !== undefined ? " · photo " + (m.image + 1) : "";
              return (
                '<li><div><span class="src">' +
                esc(m.sourceName) +
                "</span><br>" +
                (url
                  ? '<a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(url) + "</a>"
                  : "") +
                '</div><span class="pct">' +
                esc(METHOD[m.method] || m.method) +
                score +
                photo +
                "</span></li>"
              );
            })
            .join("") +
          "</ul>"
        );
      }

      function confirmHtml(data) {
        const suggested = data.matches?.[0]?.sourceName;
        const options = SHOPS.map(
          (s) => "<option" + (s === suggested ? " selected" : "") + ">" + esc(s) + "</option>",
        ).join("");
        const n = data.imageUrls?.length ?? 1;
        const what = n > 1 ? "these " + n + " photos" : "this photo";
        return (
          '<form class="confirm" id="confirm">' +
          '<label for="confirm-shop">Know where this is from? Save ' +
          what +
          " as references so future checks recognise the item:</label>" +
          '<div class="confirm-row"><select id="confirm-shop">' +
          options +
          '<option value="">Other shop…</option></select>' +
          '<input id="confirm-other" type="text" placeholder="Shop name" hidden>' +
          '<button type="submit" class="primary">Save as reference</button></div>' +
          '<p class="note" id="confirm-status" role="status"></p></form>'
        );
      }

      function wireConfirm(listingId) {
        const form = document.getElementById("confirm");
        if (!form) return;
        const select = document.getElementById("confirm-shop");
        const other = document.getElementById("confirm-other");
        select.addEventListener("change", () => {
          other.hidden = select.value !== "";
          if (!other.hidden) other.focus();
        });
        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          const status = document.getElementById("confirm-status");
          const button = form.querySelector("button");
          const shop = (select.value || other.value).trim();
          if (!shop) {
            status.textContent = "Enter the shop name.";
            return;
          }
          button.disabled = true;
          status.textContent = "Saving…";
          try {
            const data = await api("/listings/" + listingId + "/reference", { json: { source_name: shop } });
            const parts = [];
            if (data.saved) parts.push("Saved " + data.saved + " photo" + (data.saved === 1 ? "" : "s"));
            if (data.alreadySaved) parts.push(data.alreadySaved + " already saved");
            status.textContent = parts.join(", ") + " as " + shop + " reference" + (data.saved === 1 ? "" : "s") + ".";
          } catch (err) {
            status.textContent = err.message || "Saving failed.";
            button.disabled = false;
          }
        });
      }

      function notesHtml(data) {
        let html = "";
        const WEB = new Set(["web-full", "web-partial", "web-page"]);

        if (data.web) {
          const total = data.web.pages + data.web.images;
          html +=
            '<p class="note">Google Web Detection: ' +
            data.web.pages +
            " matching pages and " +
            data.web.images +
            " matching images returned.</p>";
          if (total > 0 && !data.matches?.some((m) => WEB.has(m.method))) {
            html += '<p class="note">No returned image or page matched a known shop domain.</p>';
          }
          if (data.web.entities?.length) {
            html +=
              '<p class="note">Google visual labels (context only): ' +
              data.web.entities.map((e) => esc(e.description) + " (" + Number(e.score).toFixed(2) + ")").join(", ") +
              "</p>";
          }
        }

        const model = data.model ? " (" + esc(data.model) + ")" : "";
        if (data.clip === "failed") {
          html += '<p class="note">The visual check could not run (the model failed to load). See the server log.</p>';
        } else if (data.clip === "no_references" || !data.closest) {
          html += '<p class="note">No saved reference images yet, so the visual check was skipped.</p>';
        } else {
          const photo = data.images?.length > 1 ? ", photo " + (data.closest.image + 1) : "";
          html +=
            '<p class="note">Closest saved reference' +
            model +
            ": " +
            esc(data.closest.sourceName) +
            " (similarity " +
            Number(data.closest.score).toFixed(2) +
            photo +
            ").</p>";
        }

        if (data.webSearch === "disabled") {
          html += '<p class="note">Online search is off. Set GOOGLE_VISION_API_KEY in .env to turn it on.</p>';
        } else if (data.webSearch === "failed") {
          html += '<p class="note">Google Vision search failed. Check the server terminal for the API error.</p>';
        } else if (data.webSearch === "cached") {
          html += '<p class="note">Online results reused from an earlier check of the same photo (no new request).</p>';
        }
        return html;
      }

      function findingsHtml(data) {
        if (data.webSearch === "disabled") return "";
        const findings = Array.isArray(data.onlineFindings) ? data.onlineFindings : [];
        let html =
          '<section><h2>Online search results <span class="tag">' +
          findings.length +
          "</span></h2>" +
          '<p class="section-intro">Pages, images and visual entities returned by Google Vision. A result is not proof of a product’s origin.</p>';

        if (data.webSearch === "failed") {
          html += '<p class="note">No results can be displayed because the online search failed.</p>';
        } else if (!findings.length) {
          html += '<p class="note">Google returned no web findings for this photo.</p>';
        } else {
          html += findings
            .map((f) => {
              const url = safeUrl(f.url);
              const source = f.sourceName
                ? '<div class="finding-meta">Recognized shop: ' + esc(f.sourceName) + "</div>"
                : "";
              return (
                '<article class="finding"><div class="finding-title">' +
                esc(f.title || "Untitled result") +
                '<span class="tag">' +
                esc(f.type || "result") +
                "</span></div>" +
                (url
                  ? '<div><a href="' +
                    esc(url) +
                    '" target="_blank" rel="noopener noreferrer">' +
                    esc(url) +
                    "</a></div>"
                  : "") +
                source +
                "</article>"
              );
            })
            .join("");
        }
        return html + "</section>";
      }

      function render(data) {
        result.innerHTML =
          verdictHtml(data) +
          photosHtml(data) +
          matchesHtml(data) +
          notesHtml(data) +
          confirmHtml(data) +
          findingsHtml(data);
        wireConfirm(data.id);
      }

      function listingHtml(listing) {
        const url = safeUrl(listing.url);
        if (!url && !listing.title) return "";
        return (
          '<p class="note">Checked from: ' +
          (url
            ? '<a href="' +
              esc(url) +
              '" target="_blank" rel="noopener noreferrer">' +
              esc(listing.title || url) +
              "</a>"
            : esc(listing.title)) +
          "</p>"
        );
      }

      // Opened as /?listing=<id> (from History or the browser extension): show that saved check.
      async function showSaved(id) {
        result.innerHTML = '<p class="note">Loading saved check…</p>';
        try {
          const listing = await api("/listings/" + encodeURIComponent(id));
          if (listing.imageUrls?.length) showImages(listing.imageUrls);
          if (!listing.result) throw new Error("These photos were saved without being checked.");
          render({ ...listing.result, id: listing.id, imageUrls: listing.imageUrls });
          result.insertAdjacentHTML("afterbegin", listingHtml(listing));
        } catch (err) {
          result.innerHTML = '<div class="verdict flag">' + esc(err.message || "Could not load this check.") + "</div>";
        }
      }

      const savedId = new URLSearchParams(location.search).get("listing");
      if (savedId) showSaved(savedId);

      const images = (files) => [...(files ?? [])].filter((f) => f.type.startsWith("image/"));

      document.addEventListener("paste", (e) => {
        const files = [...(e.clipboardData?.items ?? [])]
          .filter((item) => item.type.startsWith("image/"))
          .map((item) => item.getAsFile())
          .filter(Boolean);
        if (files.length) {
          e.preventDefault();
          check(files);
        }
      });

      drop.addEventListener("click", () => fileInput.click());
      drop.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          fileInput.click();
        }
      });
      fileInput.addEventListener("change", () => {
        const files = images(fileInput.files);
        if (files.length) check(files);
        fileInput.value = "";
      });
      drop.addEventListener("dragover", (e) => {
        e.preventDefault();
        drop.classList.add("over");
      });
      drop.addEventListener("dragleave", () => drop.classList.remove("over"));
      drop.addEventListener("drop", (e) => {
        e.preventDefault();
        drop.classList.remove("over");
        const files = images(e.dataTransfer?.files);
        if (files.length) check(files);
      });
    </script>
  </body>
</html>
