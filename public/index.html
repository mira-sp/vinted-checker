<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vinted Checker</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #eef1f3;
        --surface: #ffffff;
        --ink: #1a2227;
        --muted: #5c6a73;
        --line: #cfd7dc;
        --teal: #00727c;
        --flag: #b3261e;
        --flag-bg: #fbe9e7;
        --ok: #1d6b3a;
        --ok-bg: #e4f3ea;
        --maybe: #8a5300;
        --maybe-bg: #fdf1dc;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #12181b;
          --surface: #1b2328;
          --ink: #e7edf0;
          --muted: #93a3ad;
          --line: #33414a;
          --teal: #4cc3cf;
          --flag: #ff8a80;
          --flag-bg: #3a1f1d;
          --ok: #7fd49b;
          --ok-bg: #173325;
          --maybe: #f2c26b;
          --maybe-bg: #3a2c12;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          16px/1.5 "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 40px 20px 64px;
      }
      h1 {
        font-size: 1.6rem;
        margin: 0 0 4px;
        font-weight: 650;
      }
      h2 {
        font-size: 1.15rem;
        margin: 24px 0 8px;
      }
      .sub {
        color: var(--muted);
        margin: 0 0 24px;
      }
      #drop {
        background: var(--surface);
        border: 2px dashed var(--line);
        border-radius: 10px;
        min-height: 260px;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 20px;
        cursor: pointer;
      }
      #drop:focus-visible {
        outline: 3px solid var(--teal);
        outline-offset: 2px;
      }
      #drop.over {
        border-color: var(--teal);
      }
      #drop img {
        max-width: 100%;
        max-height: 360px;
        border-radius: 6px;
      }
      #hint strong {
        display: block;
        font-size: 1.1rem;
        margin-bottom: 4px;
      }
      #hint span {
        color: var(--muted);
      }
      #result {
        margin-top: 20px;
      }
      .verdict {
        border-radius: 10px;
        padding: 16px 18px;
        font-weight: 600;
      }
      .verdict.flag {
        background: var(--flag-bg);
        color: var(--flag);
      }
      .verdict.ok {
        background: var(--ok-bg);
        color: var(--ok);
      }
      .verdict.maybe {
        background: var(--maybe-bg);
        color: var(--maybe);
      }
      .confirm {
        margin-top: 20px;
        font-size: 0.9rem;
      }
      .confirm-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 6px;
      }
      .confirm select,
      .confirm button {
        font: inherit;
        padding: 6px 10px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--ink);
      }
      .confirm button {
        background: var(--teal);
        border-color: var(--teal);
        color: var(--surface);
        cursor: pointer;
      }
      .confirm button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .verdict small {
        display: block;
        font-weight: 400;
        margin-top: 2px;
        color: inherit;
        opacity: 0.85;
      }
      ul {
        list-style: none;
        margin: 12px 0 0;
        padding: 0;
      }
      li {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 14px;
        margin-bottom: 8px;
        display: flex;
        gap: 12px;
        align-items: baseline;
        justify-content: space-between;
        overflow-wrap: anywhere;
      }
      li .src {
        font-weight: 600;
      }
      li a {
        color: var(--teal);
        word-break: break-all;
        font-size: 0.9rem;
      }
      li .pct {
        color: var(--muted);
        white-space: nowrap;
        font-size: 0.9rem;
      }
      .note {
        color: var(--muted);
        font-size: 0.9rem;
        margin-top: 12px;
      }
      .section {
        margin-top: 24px;
        padding-top: 4px;
      }
      .section-intro {
        color: var(--muted);
        font-size: 0.9rem;
        margin: 0 0 12px;
      }
      .finding {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px 14px;
        margin: 8px 0;
        overflow-wrap: anywhere;
      }
      .finding-title {
        font-weight: 600;
      }
      .finding-meta {
        color: var(--muted);
        font-size: 0.85rem;
        margin-top: 4px;
      }
      .finding a {
        color: var(--teal);
        word-break: break-all;
        font-size: 0.9rem;
      }
      .tag {
        display: inline-block;
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 1px 6px;
        font-size: 0.75rem;
        color: var(--muted);
        margin-left: 6px;
        font-weight: 400;
      }
      @media (prefers-reduced-motion: no-preference) {
        #drop {
          transition: border-color 0.15s;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Vinted Checker</h1>
      <p class="sub">Is this photo from a fast-fashion shop? Paste an image to find out.</p>

      <div id="drop" tabindex="0" role="button" aria-label="Paste, drop or choose an image">
        <div id="hint">
          <strong>Paste an image with Ctrl+V (Cmd+V on Mac)</strong>
          <span>or drop a file here, or click to choose one</span>
        </div>
      </div>
      <input id="file" type="file" accept="image/*" hidden />

      <div id="result" aria-live="polite"></div>
    </main>

    <script>
      const drop = document.getElementById("drop");
      const fileInput = document.getElementById("file");
      const result = document.getElementById("result");

      const METHOD = {
        clip: "Visually similar saved reference",
        phash: "Near-identical saved image",
        "web-full": "Exact image found online",
        "web-partial": "Partially matching image online",
        "web-page": "Image appears on this page",
      };
      const WEB_METHODS = new Set(["web-full", "web-partial", "web-page"]);
      const SHOPS = ["Shein", "Temu", "AliExpress", "Zaful", "Cider", "DHgate", "Wish"];

      // Ask the server once whether online search is configured, so the loading text is accurate.
      let webSearch = false;
      fetch("/health")
        .then((r) => r.json())
        .then((h) => {
          webSearch = Boolean(h.webSearch);
        })
        .catch(() => {});

      function esc(s) {
        const d = document.createElement("div");
        d.textContent = s ?? "";
        return d.innerHTML;
      }

      function safeUrl(value) {
        try {
          const url = new URL(value);
          if (url.protocol === "https:" || url.protocol === "http:") return url.href;
        } catch {}
        return null;
      }

      function preview(file) {
        const img = document.createElement("img");
        img.alt = "Image being checked";
        img.src = URL.createObjectURL(file);
        drop.replaceChildren(img);
      }

      async function check(file) {
        preview(file);
        result.innerHTML =
          '<p class="note">' +
          (webSearch ? "Checking image and searching online…" : "Checking image against saved references…") +
          "</p>";

        const form = new FormData();
        form.append("file", file, file.name || "pasted.png");

        try {
          const res = await fetch("/check", { method: "POST", body: form });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || "Check failed.");
          render(data);
        } catch (err) {
          result.innerHTML = '<div class="verdict flag">' + esc(err.message || "Check failed.") + "</div>";
        }
      }

      function verdictHtml(data) {
        const n = data.matches?.length ?? 0;
        const count = n + " match" + (n === 1 ? "" : "es") + " found";
        if (data.verdict === "likely_fast_fashion") {
          return '<div class="verdict flag">Likely from a fast-fashion shop<small>' + count + "</small></div>";
        }
        if (data.verdict === "possible_fast_fashion") {
          return (
            '<div class="verdict maybe">Possibly from a fast-fashion shop<small>' +
            count +
            ", weak evidence only. Open the links before deciding.</small></div>"
          );
        }
        return '<div class="verdict ok">No fast-fashion match found<small>This does not prove the photo is original.</small></div>';
      }

      function matchesHtml(matches) {
        if (!matches?.length) return "";
        return (
          "<h2>Shop matches</h2><ul>" +
          matches
            .map((m) => {
              const url = safeUrl(m.sourceUrl);
              // Only local checks have a real score; web results only say what kind of match it was.
              const score = typeof m.similarity === "number" ? " · " + Math.round(m.similarity * 100) + "%" : "";
              return (
                '<li><div><span class="src">' +
                esc(m.sourceName) +
                "</span><br>" +
                (url
                  ? '<a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(url) + "</a>"
                  : "") +
                '</div><span class="pct">' +
                esc(METHOD[m.method] || m.method) +
                score +
                "</span></li>"
              );
            })
            .join("") +
          "</ul>"
        );
      }

      function confirmHtml(data) {
        const suggested = data.matches?.[0]?.sourceName;
        const options = SHOPS.map(
          (s) => "<option" + (s === suggested ? " selected" : "") + ">" + esc(s) + "</option>",
        ).join("");
        return (
          '<form class="confirm" id="confirm">' +
          '<label for="confirm-shop">Know where this is from? Save it as a reference so future checks recognise it:</label>' +
          '<div class="confirm-row"><select id="confirm-shop">' +
          options +
          "</select>" +
          '<button type="submit">Save as reference</button></div>' +
          '<p class="note" id="confirm-status" role="status"></p></form>'
        );
      }

      function wireConfirm(listingId) {
        const form = document.getElementById("confirm");
        if (!form) return;
        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          const status = document.getElementById("confirm-status");
          const button = form.querySelector("button");
          const shop = document.getElementById("confirm-shop").value;
          button.disabled = true;
          status.textContent = "Saving…";
          try {
            const res = await fetch("/listings/" + listingId + "/reference", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ source_name: shop }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || "Saving failed.");
            status.textContent =
              data.status === "already_saved"
                ? "This image is already saved as a " + shop + " reference."
                : "Saved as a " + shop + " reference.";
          } catch (err) {
            status.textContent = err.message || "Saving failed.";
            button.disabled = false;
          }
        });
      }

      function notesHtml(data) {
        let html = "";

        if (data.web) {
          const total = data.web.pages + data.web.images;
          html +=
            '<p class="note">Google Web Detection: ' +
            data.web.pages +
            " matching pages and " +
            data.web.images +
            " matching images returned.</p>";
          if (total > 0 && !data.matches?.some((m) => WEB_METHODS.has(m.method))) {
            html += '<p class="note">No returned image or page matched a known shop domain.</p>';
          }
          if (data.web.entities?.length) {
            html +=
              '<p class="note">Google visual labels (context only): ' +
              data.web.entities.map((e) => esc(e.description) + " (" + Number(e.score).toFixed(2) + ")").join(", ") +
              "</p>";
          }
        }

        if (data.clip === "failed") {
          html +=
            '<p class="note">The local visual check could not run (the CLIP model failed to load). See the server log.</p>';
        } else if (data.clip === "no_references" || !data.closest) {
          html += '<p class="note">No saved reference images yet, so the local visual check was skipped.</p>';
        } else {
          html +=
            '<p class="note">Closest saved reference: ' +
            esc(data.closest.sourceName) +
            " (similarity " +
            Number(data.closest.score).toFixed(2) +
            ").</p>";
        }

        if (data.webSearch === "disabled") {
          html += '<p class="note">Online search is disabled. Set GOOGLE_VISION_API_KEY in .env to enable it.</p>';
        } else if (data.webSearch === "failed") {
          html += '<p class="note">Google Vision search failed. Check the server terminal for the API error.</p>';
        }
        return html;
      }

      function findingsHtml(data) {
        if (data.webSearch === "disabled") return "";
        const findings = Array.isArray(data.onlineFindings) ? data.onlineFindings : [];

        let html =
          '<section class="section">' +
          '<h2>Online search results <span class="tag">' +
          findings.length +
          "</span></h2>" +
          '<p class="section-intro">Pages, images and visual entities returned by Google Vision. A result is not proof of a product’s origin.</p>';

        if (data.webSearch === "failed") {
          html += '<p class="note">No results can be displayed because the online search failed.</p>';
        } else if (!findings.length) {
          html += '<p class="note">Google returned no web findings for this image.</p>';
        } else {
          html += findings
            .map((f) => {
              const url = safeUrl(f.url);
              const source = f.sourceName
                ? '<div class="finding-meta">Recognized shop: ' + esc(f.sourceName) + "</div>"
                : "";
              return (
                '<article class="finding"><div class="finding-title">' +
                esc(f.title || "Untitled result") +
                '<span class="tag">' +
                esc(f.type || "result") +
                "</span></div>" +
                (url
                  ? '<div><a href="' +
                    esc(url) +
                    '" target="_blank" rel="noopener noreferrer">' +
                    esc(url) +
                    "</a></div>"
                  : "") +
                source +
                "</article>"
              );
            })
            .join("");
        }
        return html + "</section>";
      }

      function render(data) {
        result.innerHTML =
          verdictHtml(data) + matchesHtml(data.matches) + notesHtml(data) + confirmHtml(data) + findingsHtml(data);
        wireConfirm(data.id);
      }

      document.addEventListener("paste", (e) => {
        for (const item of e.clipboardData?.items ?? []) {
          if (item.type.startsWith("image/")) {
            const file = item.getAsFile();
            if (file) {
              e.preventDefault();
              check(file);
              return;
            }
          }
        }
      });

      drop.addEventListener("click", () => fileInput.click());

      drop.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          fileInput.click();
        }
      });

      fileInput.addEventListener("change", () => {
        if (fileInput.files[0]) check(fileInput.files[0]);
      });

      drop.addEventListener("dragover", (e) => {
        e.preventDefault();
        drop.classList.add("over");
      });

      drop.addEventListener("dragleave", () => drop.classList.remove("over"));

      drop.addEventListener("drop", (e) => {
        e.preventDefault();
        drop.classList.remove("over");
        const file = [...(e.dataTransfer?.files ?? [])].find((f) => f.type.startsWith("image/"));
        if (file) check(file);
      });
    </script>
  </body>
</html>
